<div class="page-viewport-center">
  <div class="khmer-equation-row">

    <!-- Word 1: ខ្មែរ (Base Layer: Blue -> Sweeps to Red) -->
    <span class="svg-container-word1">
      <svg xmlns="http://w3.org" viewBox="0 0 400 320" width="100%" height="100%">
        <defs>
          <clipPath id="first-letter-clip">
            <rect id="sliding-rect" x="140" y="0" width="0" height="230" />
          </clipPath>
        </defs>
        <!-- Blue base text, Red animated overlay text -->
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="khmer-text blue-text">ខ្មែរ</text>
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="khmer-text red-text" clip-path="url(#first-letter-clip)">ខ្មែរ</text>
      </svg>
    </span>

    <!-- Operator: + -->
    <span class="operator-wrapper">
      <span class="khmer-text operator">+</span>
    </span>

    <!-- Word 2: មន (FIXED OVERLAY ALIGNMENT) -->
    <span class="svg-container-word2">
      <svg xmlns="http://w3.org" viewBox="0 0 400 320" width="100%" height="100%">
        <defs>
          <clipPath id="second-letter-clip">
            <rect id="sliding-rect-2" x="50" y="0" width="0" height="320" />
          </clipPath>
        </defs>

        <!-- Base Layer: Both letters are Blue -->
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="khmer-text blue-text">
          <tspan>ម</tspan>
          <tspan dx="25">ន</tspan>
        </text>

        <!-- Overlay Layer: Transparent anchor forces perfect stacking position -->
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="khmer-text">
          <tspan class="red-text" clip-path="url(#second-letter-clip)">ម</tspan>
          <tspan fill="transparent" dx="25">ន</tspan> <!-- This keeps the red ម perfectly on top of the blue ម -->
        </text>
      </svg>
    </span>

    <!-- Operator: = -->
    <span class="operator-wrapper">
      <span class="khmer-text operator">=</span>
    </span>

    <!-- Word 3: ខម -->
    <span class="svg-container-word3">
      <svg xmlns="http://w3.org" viewBox="0 0 400 320" width="100%" height="100%">
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="khmer-text">
          <tspan class="red-text">ខម</tspan>
        </text>
      </svg>
    </span>

  </div>
</div>
